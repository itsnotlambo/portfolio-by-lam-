"<!DOCTYPE html>\n<html><head>\n<meta charset=\"utf-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n<script src=\"7dc063bc-bce8-474c-9ebc-4fb765853500\"><\u002Fscript>\n<\u002Fhead>\n<body>\n<x-dc>\n<helmet>\n<style>\nbody{margin:0;background:#e6e6eb;-webkit-font-smoothing:antialiased}\na{color:#007aff;text-decoration:none}a:hover{color:#0062cc}\n@keyframes rise{from{opacity:0;transform:translateY(14px) scale(.98)}to{opacity:1;transform:none}}@keyframes ring{from{stroke-dasharray:0 100}}@keyframes grow{from{transform:scaleX(0)}}@keyframes blob{0%,100%{transform:translate(0,0) scale(1)}33%{transform:translate(40px,-30px) scale(1.15)}66%{transform:translate(-30px,40px) scale(.9)}}@keyframes shine{from{background-position:0% 50%}to{background-position:200% 50%}}@keyframes popup{0%{opacity:0;transform:translate(-50%,10px) scale(.6)}20%{opacity:1;transform:translate(-50%,0) scale(1.15)}75%{opacity:1}100%{opacity:0;transform:translate(-50%,-34px) scale(1)}}@keyframes bounce{0%{transform:scale(.6)}60%{transform:scale(1.15)}100%{transform:scale(1)}}@keyframes typing{0%,60%,100%{transform:translateY(0);opacity:.4}30%{transform:translateY(-4px);opacity:1}}@keyframes spin{to{transform:rotate(360deg)}}@keyframes sheetUp{from{transform:translateY(100%)}}@keyframes fadeIn{from{opacity:0}}@keyframes ping{0%{transform:scale(1);opacity:.55}100%{transform:scale(1.7);opacity:0}}@keyframes eq{0%,100%{transform:scaleY(.3)}50%{transform:scaleY(1)}}@keyframes scan{0%{top:0}50%{top:calc(100% - 3px)}100%{top:0}}@keyframes shake{0%,100%{transform:translateX(0)}20%,60%{transform:translateX(-8px)}40%,80%{transform:translateX(8px)}}@keyframes faceScan{0%,100%{transform:scale(1);opacity:1}50%{transform:scale(1.12);opacity:.6}}@keyframes draw{from{stroke-dashoffset:1}}@keyframes shimmer{0%{background-position:-200% 0}100%{background-position:200% 0}}@keyframes slideIn{from{transform:translateX(100%)}}@keyframes flame{0%,100%{transform:scale(1) rotate(-4deg)}50%{transform:scale(1.15) rotate(4deg)}}\ntextarea::placeholder,input::placeholder{color:var(--ter)}\n<\u002Fstyle>\n<\u002Fhelmet>\n<div style=\"min-height:100vh;display:flex;flex-direction:column;align-items:center;gap:10px;padding:12px 12px 14px;box-sizing:border-box;font-family:-apple-system,BlinkMacSystemFont,'SF Pro Text','Helvetica Neue',Helvetica,sans-serif;color:#fff;background:radial-gradient(120% 80% at 50% 0%,#2c1858,#0d0720 70%)\">\n  <div style=\"display:flex;flex-direction:column;align-items:center;gap:10px;max-width:100%;text-align:center\">\n    <div style=\"font-size:12px;font-weight:700;letter-spacing:.06em;color:rgba(255,255,255,.55)\">REVISE · TAP AROUND, OR JUMP TO A SCREEN<\u002Fdiv>\n    <div style=\"display:flex;gap:6px;max-width:100%;overflow-x:auto;scrollbar-width:none;padding:2px\">\n      <sc-for list=\"{{ jumps }}\" as=\"j\" hint-placeholder-count=\"8\">\n        <button sc-camel-on-click=\"{{ j.go }}\" style=\"border:.5px solid rgba(255,255,255,.18);background:rgba(255,255,255,.08);border-radius:999px;padding:7px 13px;font:600 13px -apple-system,BlinkMacSystemFont,'Helvetica Neue',sans-serif;color:#fff;cursor:pointer;white-space:nowrap;flex:none\" style-hover=\"background:rgba(255,255,255,.16)\">{{ j.label }}<\u002Fbutton>\n      <\u002Fsc-for>\n    <\u002Fdiv>\n  <\u002Fdiv>\n  <div style=\"width:393px;height:852px;border-radius:56px;box-shadow:0 0 0 11px #1a1a1c,0 0 0 12px #3a3a3c,0 30px 80px rgba(0,0,0,.5);overflow:hidden;position:relative;flex:none;zoom:{{ fit }}\">\n    <div style=\"{{ themeVars }}\">\n    <div style=\"position:absolute;inset:0;background:var(--bg,#f2f2f7);color:var(--label,#000);font-family:var(--ff);letter-spacing:var(--lsp,-.01em)\">\n\n      {{ blobs }}\n      <div ref=\"{{ scroller }}\" sc-camel-on-scroll=\"{{ onScroll }}\" style=\"position:absolute;inset:0;overflow-y:auto;scrollbar-width:none\">\n\n        <sc-if value=\"{{ isToday }}\" hint-placeholder-val=\"{{ true }}\">\n          <div style=\"padding:92px 0 120             <\u002Fdiv>\n                  <\u002Fdiv>\n                <\u002Fsc-for>\n              <\u002Fdiv>\n              <div style=\"padding:6px 24px 0;font-size:calc(13px*var(--ts,1));line-height:1.4;color:var(--sec)\">Examined often, and where your practice scores are lowest.<\u002Fdiv>\n              <div style=\"padding:20px 24px 8px;font-size:calc(20px*var(--ts,1));font-weight:700;letter-spacing:-.01em\">How often topics come up<\u002Fdiv>\n              <div style=\"margin:0 16px;background:var(--card,#fff);backdrop-filter:blur(24px) saturate(160%);-webkit-backdrop-filter:blur(24px) saturate(160%);border:.5px solid var(--sep);border-radius:22px;overflow:hidden\">\n                <sc-for list=\"{{ freqList }}\" as=\"f\" hint-placeholder-count=\"4\">\n                  <div style=\"display:flex;align-items:center;padding-left:16px;animation:rise .5s cubic-bezier(.2,.8,.2,1) both;animation-delay:{{ f.delay }}\">\n                    <div style=\"flex:1;min-width:0;display:flex;align-items:center;gap:10px;padding:12px 16px 12px 0;border-top:{{ f.bt }}\">\n                      <div style=\"flex:1;min-width:0;display:flex;flex-direction:column;gap:2px\">\n                        <div style=\"font-size:calc(17px*var(--ts,1))\">{{ f.n }}<\u002Fdiv>\n                        <div style=\"font-size:calc(15px*var(--ts,1));color:var(--sec)\">{{ f.sub }}<\u002Fdiv>\n                      <\u002Fdiv>\n                      <div style=\"display:flex;align-items:center;gap:4px;padding:4px 10px;border-radius:999px;background:var(--fill);font-size:calc(13px*var(--ts,1));font-weight:600;white-space:nowrap;color:{{ f.c }}\">{{ f.glyph }} {{ f.trend }}<\u002Fdiv>\n                    <\u002Fdiv>\n                  <\u002Fdiv>\n                <\u002Fsc-for>\n              <\u002Fdiv>\n            <\u002Fsc-if>\n          <\u002Fdiv>\n        <\u002Fsc-if>\n\n        <sc-if value=\"{{ isQuestion }}\" hint-placeholder-val=\"{{ false }}\">\n          <div style=\"padding:104px 0 120px;display:flex;flex-direction:column;animation:rise .45s cubic-bezier(.2,.8,.2,1) both\">\n            <div style=\"padding:0 24px 6px;font-size:calc(13px*var(--ts,1));font-weight:600;color:var(--sec);letter-spacing:.02em\">{{ qCaption }}<\u002Fdiv>\n            <div style=\"margin:0 16px;background:var(--card,#fff);backdrop-filter:blur(24px) saturate(160%);-webkit-backdrop-filter:blur(24px) saturate(160%);border:.5px solid var(--sep);border-radius:22px;padding:18px 16px;display:flex;flex-direction:column;gap:14px;font-size:calc(17px*var(--ts,1));line-height:1.4\">\n              <sc-if value=\"{{ q.maths }}\" hint-placeholder-val=\"{{ true }}\">\n                <div>In the diagram, angle <i style=\"font-family:'New York',ui-serif,Georgia,serif\">A<\u002Fi> is a right angle.<\u002Fdiv>\n                <svg sc-camel-view-box=\"0 0 300 190\" style=\"width:100%;height:auto;color:var(--label)\">\n                  <polygon points=\"80,160 250,160 80,32\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.5\" stroke-linejoin=\"round\"><\u002Fpolygon>\n                  <polyline points=\"80,146 94,146 94,160\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.5\"><\u002Fpolyline>\n                  <text x=\"66\" y=\"178\" font-size=\"15\" font-weight=\"600\" fill=\"currentColor\">A<\u002Ftext>\n                  <text x=\"258\" y=\"166\" font-size=\"15\" font-weight=\"600\" fill=\"currentColor\">B<\u002Ftext>\n                  <text x=\"66\" y=\"30\" font-size=\"15\" font-weight=\"600\" fill=\"currentColor\">C<\u002Ftext>\n                  <text x=\"28\" y=\"101\" font-size=\"15\" fill=\"var(--sec)\">6 cm<\u002Ftext>\n                  <text x=\"146\" y=\"182\" font-size=\"15\" fill=\"var(--sec)\">8 cm<\u002Ftext>\n                  <text x=\"172\" y=\"88\" font-size=\"18\" font-style=\"italic\" font-family=\"ui-serif,Georgia,serif\" fill=\"var(--tint)\">x<\u002Ftext>\n                <\u002Fsvg>\n                <div>Find the length <i style=\"font-family:'New York',ui-serif,Georgia,serif\">x<\u002Fi>.<\u002Fdiv>\n              <\u002Fsc-if>\n              <sc-if value=\"{{ q.bio }}\" hint-placeholder-val=\"{{ false }}\">\n                <div>{{ q.text }}<\u002Fdiv>\n              <\u002Fsc-if>\n            <\u002Fdiv>\n            <div style=\"padding:20px 24px 8px;font-size:calc(20px*var(--ts,1));font-weight:700;letter-spacing:-.01em\">Your answer<\u002Fdiv>\n            <div style=\"margin:0 16px;background:var(--card,#fff);backdrop-filter:blur(24px) saturate(160%);-webkit-backdrop-filter:blur(24px) saturate(160%);border:.5px solid var(--sep);border-radius:22px;padding:14px 16px\">\n              <textarea value=\"{{ answer }}\" sc-camel-on-change=\"{{ onAnswer }}\" placeholder=\"Write your answer, then check it\" style=\"width:100%;min-height:120px;border:0;outline:none;resize:none;background:transparent;color:var(--label);font-family:inherit;font-size:calc(17px*var(--ts,1));line-height:1.4;padding:0;display:block\"><\u002Ftextarea>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fsc-if>\n\n        <sc-if value=\"{{ isMarking }}\" hint-placeholder-val=\"{{ false }}\">\n          <div style=\"padding:104px 0 120px;display:flex;flex-direction:column;animation:rise .45s cubic-bezier(.2,.8,.2,1) both\">\n            <div style=\"padding:0 24px 6px;font-size:calc(13px*var(--ts,1));font-weight:600;color:var(--sec);letter-spacing:.02em\">MODEL ANSWER<\u002Fdiv>\n            <div style=\"margin:0 16px;background:var(--card,#fff);backdrop-filter:blur(24px) saturate(160%);-webkit-backdrop-filter:blur(24px) saturate(160%);border:.5px solid var(--sep);border-radius:22px;padding:16px;font-size:calc(17px*var(--ts,1));line-height:1.5\">\n              <sc-if value=\"{{ q.maths }}\" hint-placeholder-val=\"{{ true }}\">\n                <div style=\"font-family:'New York',ui-serif,Georgia,serif;font-size:calc(19px*var(--ts,1))\"><i>x<\u002Fi>² = 6² + 8² = 36 + 64 = 100<\u002Fdiv>\n                <div>So <i style=\"font-family:'New York',ui-serif,Georgia,serif\">x<\u002Fi> = 10 cm.<\u002Fdiv>\n              <\u002Fsc-if>\n              <sc-if value=\"{{ q.bio }}\" hint-placeholder-val=\"{{ false }}\">\n                <div>{{ q.model }}<\u002Fdiv>\n              <\u002Fsc-if>\n            <\u002Fdiv>\n            <sc-if value=\"{{ hasAnswer }}\" hint-placeholder-val=\"{{ false }}\">\n              <div style=\"padding:14px 24px 6px;font-size:calc(13px*var(--ts,1));font-weight:600;color:var(--sec);letter-spacing:.02em\">YOUR ANSWER<\u002Fdiv>\n              <div style=\"margin:0 16px;background:var(--card,#fff);backdrop-filter:blur(24px) saturate(160%);-webkit-backdrop-filter:blur(24px) saturate(160%);border:.5px solid var(--sep);border-radius:22px;padding:16px;font-size:calc(17px*var(--ts,1));line-height:1.4;white-space:pre-wrap\">{{ answer }}<\u002Fdiv>\n            <\u002Fsc-if>\n\n            <div style=\"padding:20px 24px 8px;font-size:calc(20px*var(--ts,1));font-weight:700;letter-spacing:-.01em\">Mark your answer<\u002Fdiv>\n            <div style=\"margin:0 16px;background:var(--card,#fff);backdrop-filter:blur(24px) saturate(160%);-webkit-backdrop-filter:blur(24px) saturate(160%);border:.5px solid var(--sep);border-radius:22px;overflow:hidden\">\n              <sc-for list=\"{{ points }}\" as=\"p\" hint-placeholder-count=\"4\">\n                <div sc-camel-on-click=\"{{ p.toggle }}\" style=\"display:flex;align-items:center;gap:14px;padding-left:16px;cursor:pointer;animation:rise .5s cubic-bezier(.2,.8,.2,1) both;animation-delay:{{ p.delay }}\" style-active=\"background:var(--fill)\">\n                  <div style=\"width:26px;height:26px;border-radius:50%;flex:none;box-sizing:border-box;display:flex;align-items:center;justify-content:center;transition:all .3s cubic-bezier(.3,1.7,.5,1);transform:scale({{ p.sc }});box-shadow:{{ p.glow }};background:{{ p.bg }};border:2px solid {{ p.border }}\">\n                    <svg width=\"13\" height=\"10\" sc-camel-view-box=\"0 0 13 10\" style=\"opacity:{{ p.op }}\"><polyline points=\"1.5,5 5,8.5 11.5,1.5\" fill=\"none\" stroke=\"#fff\" stroke-width=\"2.4\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><\u002Fpolyline><\u002Fsvg>\n                  <\u002Fdiv>\n                  <div style=\"flex:1;min-width:0;display:flex;flex-direction:column;gap:2px;padding:12px 16px 12px 0;border-top:{{ p.bt }}\">\n                    <div style=\"font-size:calc(17px*var(--ts,1))\">{{ p.t }}<\u002Fdiv>\n                    <div style=\"font-size:calc(15px*var(--ts,1));color:var(--sec)\">1 mark<\u002Fdiv>\n                  <\u002Fdiv>\n                <\u002Fdiv>\n              <\u002Fsc-for>\n            <\u002Fdiv>\n            <div style=\"padding:6px 24px 0;font-size:calc(13px*var(--ts,1));line-height:1.4;color:var(--sec)\">Tick each point you made. A teacher hasn’t checked this marking scheme yet.<\u002Fdiv>\n\n            <div style=\"margin:20px 16px 0;background:var(--card,#fff);backdrop-filter:blur(24px) saturate(160%);-webkit-backdrop-filter:blur(24px) saturate(160%);border:.5px solid var(--sep);border-radius:22px;padding:16px;display:flex;align-items:center;gap:16px\">\n              <div style=\"position:relative;width:64px;height:64px;flex:none\">\n                <svg width=\"64\" height=\"64\" sc-camel-view-box=\"0 0 36 36\" style=\"transform:rotate(-90deg)\"><circle cx=\"18\" cy=\"18\" r=\"15\" fill=\"none\" stroke=\"var(--fill)\" stroke-width=\"4\"><\u002Fcircle><circle cx=\"18\" cy=\"18\" r=\"15\" fill=\"none\" stroke=\"{{ scoreColor }}\" stroke-width=\"4\" stroke-linecap=\"round\" sc-camel-path-length=\"100\" stroke-dasharray=\"{{ scoreDash }}\" style=\"transition:stroke-dasharray .4s cubic-bezier(.3,.7,.2,1)\"><\u002Fcircle><\u002Fsvg>\n                <div style=\"position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:18px;font-weight:700;font-variant-numeric:tabular-nums\">{{ scoreFrac }}<\u002Fdiv>\n              <\u002Fdiv>\n              <div style=\"display:flex;flex-direction:column;gap:2px\">\n                <div style=\"font-size:calc(20px*var(--ts,1));font-weight:600\">{{ scoreTitle }}<\u002Fdiv>\n                <div style=\"font-size:calc(15px*var(--ts,1));color:var(--sec)\">{{ scoreMsg }}<\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fsc-if>\n\n        <sc-if value=\"{{ isGames }}\" hint-placeholder-val=\"{{ false }}\">\n          <div style=\"padding:92px 0 120px;display:flex;flex-direction:column;animation:rise .45s cubic-bezier(.2,.8,.2,1) both\">\n            <div style=\"padding:0 20px 10px;font-size:calc(34px*var(--ts,1));font-weight:800;letter-spacing:-.03em;line-height:1.15;background:var(--title);-webkit-background-clip:text;background-clip:text;color:transparent\">Games<\u002Fdiv>\n            <div style=\"margin:0 16px;display:flex;flex-direction:column;gap:12px\">\n              <sc-for list=\"{{ gameCards }}\" as=\"c\" hint-placeholder-count=\"2\">\n                <div sc-camel-on-click=\"{{ c.play }}\" style=\"position:relative;overflow:hidden;border-radius:24px;padding:18px;min-height:150px;display:flex;flex-direction:column;justify-content:space-between;gap:18px;color:#fff;background:{{ c.grad }};box-shadow:0 10px 30px var(--shadow);cursor:pointer;transition:transform .2s;animation:rise .5s cubic-bezier(.2,.8,.2,1) both;animation-delay:{{ c.delay }}\" style-active=\"transform:scale(.97)\">\n                  <div style=\"position:absolute;right:-40px;top:-40px;width:160px;height:160px;border-radius:50%;background:rgba(255,255,255,.16);animation:blob 12s ease-in-out infinite\"><\u002Fdiv>\n                  <div style=\"position:relative;display:flex;flex-direction:column;gap:4px\">\n                    <div style=\"font-size:calc(12px*var(--ts,1));font-weight:700;letter-spacing:.04em;opacity:.85\">{{ c.meta }}<\u002Fdiv>\n                    <div style=\"font-size:calc(28px*var(--ts,1));font-weight:800;letter- ",\"Dominant and recessive\",\"A dominant allele is expressed with just one copy. A recessive allele is only expressed when there are two copies.\",\"dominant recessive\"],[\"P5\",\"Genotype and phenotype\",\"Genotype is the combination of alleles you have. Phenotype is the characteristic that results.\",\"genotype phenotype characteristic\"],[\"P6\",\"Homozygous and heterozygous\",\"Homozygous means two identical alleles. Heterozygous means two different alleles.\",\"homozygous heterozygous identical\"]]},\n  \"Cell biology\":{subj:\"Biology\", pts:[[\"P1\",\"Eukaryotic and prokaryotic cells\",\"Animal and plant cells are eukaryotic and have a nucleus. Bacteria are prokaryotic: no nucleus, DNA in a loop, sometimes plasmids.\",\"eukaryot prokaryot bacteri plasmid\"],[\"P2\",\"Parts of an animal cell\",\"The nucleus controls the cell, reactions happen in the cytoplasm, the membrane controls what enters and leaves, mitochondria release energy and ribosomes make proteins.\",\"nucleus cytoplasm membrane mitochondri ribosome\"],[\"P3\",\"Extra parts in plant cells\",\"Plant cells also have a cellulose cell wall, chloroplasts for photosynthesis and a permanent vacuole filled with cell sap.\",\"wall cellulose chloroplast vacuole\"],[\"P4\",\"Specialised cells\",\"Cells are specialised for their job. Sperm cells have a tail; root hair cells have a large surface area.\",\"specialis sperm root hair nerve\"],[\"P5\",\"Microscopy\",\"Magnification = image size ÷ actual size. Electron microscopes have higher magnification and resolution than light microscopes.\",\"magnif microscope resolution\"]]},\n  \"Respiration\":{subj:\"Biology\", pts:[[\"P1\",\"Why cells respire\",\"Respiration is an exothermic reaction in all living cells that transfers energy from glucose.\",\"energy exothermic glucose cell\"],[\"P2\",\"Aerobic respiration\",\"Aerobic respiration uses oxygen: glucose + oxygen → carbon dioxide + water. It releases the most energy.\",\"aerobic oxygen carbon dioxide water\"],[\"P3\",\"Anaerobic respiration in muscles\",\"Without enough oxygen, muscles respire anaerobically: glucose → lactic acid. Less energy is released and an oxygen debt builds up.\",\"anaerobic lactic debt muscle\"],[\"P4\",\"Anaerobic respiration in plants and yeast\",\"Plants and yeast make ethanol and carbon dioxide. In yeast this is fermentation, used for bread and brewing.\",\"yeast ethanol ferment\"],[\"P5\",\"Respiration is not breathing\",\"Breathing moves air in and out of the lungs. Respiration is a chemical reaction inside cells.\",\"breath lung\"]]},\n  \"Nutrition in plants\":{subj:\"Biology\", pts:[[\"P1\",\"The photosynthesis equation\",\"Carbon dioxide + water → glucose + oxygen, using light energy. It is endothermic.\",\"carbon dioxide water glucose oxygen light endothermic\"],[\"P2\",\"Where it happens\",\"Photosynthesis happens in chloroplasts, which contain chlorophyll to absorb light.\",\"chloroplast chlorophyll\"],[\"P3\",\"Limiting factors\",\"The rate is limited by light intensity, carbon dioxide concentration and temperature.\",\"limit intensity temperature rate\"],[\"P4\",\"How plants use glucose\",\"Glucose is used for respiration, stored as starch, made into cellulose for cell walls, and combined with nitrate ions to make amino acids.\",\"starch cellulose respir nitrate\"],[\"P5\",\"Leaf adaptations\",\"Leaves are broad and thin, with stomata for gas exchange and palisade cells packed with chloroplasts.\",\"stomata palisade broad thin\"]]},\n  \"Ecology\":{subj:\"Biology\", pts:[[\"P1\",\"Ecosystem words\",\"A habitat is where an organism lives; a population is all of one species there; a community is all the populations; an ecosystem includes the non-living parts too.\",\"habitat population community ecosystem\"],[\"P2\",\"Food chains\",\"Food chains start with a producer. Energy passes to primary, secondary and tertiary consumers, and some is lost at each level.\",\"producer consumer food chain\"],[\"P3\",\"Abiotic and biotic factors\",\"Abiotic factors are non-living, like light and temperature. Biotic factors are living, like predators and disease.\",\"abiotic biotic predator\"],[\"P4\",\"Cycles\",\"Carbon and water cycle through living things and the environment by photosynthesis, respiration, decomposition and evaporation.\",\"cycle decompos evaporat\"],[\"P5\",\"Biodiversity\",\"Biodiversity is the variety of species in an area. Deforestation and pollution reduce it.\",\"biodiversity deforest pollut variety\"]]},\n  \"Reproduction\":{subj:\"Biology\", pts:[[\"P1\",\"Sexual and asexual reproduction\",\"Sexual reproduction joins male and female gametes and gives variation. Asexual reproduction needs one parent and makes identical clones.\",\"sexual asexual gamete clone variation\"],[\"P2\",\"Meiosis\",\"Gametes are made by meiosis, which halves the chromosome number and makes four genetically different cells.\",\"meiosis half four\"],[\"P3\",\"Fertilisation\",\"At fertilisation, two gametes fuse and the full number of chromosomes is restored.\",\"fertilis fuse zygote\"],[\"P4\",\"Hormones\",\"In humans, hormones such as oestrogen and testosterone control puberty and the menstrual cycle.\",\"hormone oestrogen testosterone menstrual\"]]},\n  \"Classification of living things\":{subj:\"Biology\", pts:[[\"P1\",\"Kingdoms\",\"Living things are grouped into kingdoms such as animals, plants, fungi, protists and prokaryotes.\",\"kingdom fungi protist\"],[\"P2\",\"The Linnaean system\",\"The levels go kingdom, phylum, class, order, family, genus, species.\",\"phylum class order family genus\"],[\"P3\",\"Binomial names\",\"Each species has a two-part Latin name, genus then species, like Homo sapiens.\",\"binomial genus latin sapiens\"],[\"P4\",\"The three-domain system\",\"Woese split life into archaea, bacteria and eukaryota, based on chemical analysis.\",\"domain archaea eukaryota woese\"]]},\n  \"Nutrition in animals\":{subj:\"Biology\", pts:[[\"P1\",\"A balanced diet\",\"A balanced diet includes carbohydrates, proteins, lipids, vitamins, minerals, water and fibre.\",\"carbohydrate protein lipid vitamin fibre\"],[\"P2\",\"The digestive system\",\"Food passes from the mouth to the oesophagus, stomach, small intestine and large intestine.\",\"stomach intestine oesophag\"],[\"P3\",\"Enzymes\",\"Enzymes break large molecules into small ones: amylase for starch, protease for protein, lipase for lipids. They are not used up.\",\"enzyme amylase protease lipase\"],[\"P4\",\"Absorption\",\"Digested food is absorbed in the small intestine, where villi give a large surface area.\",\"absor villi surface\"]]},\n  \"Transport in plants and animals\":{subj:\"Biology\", pts:[[\"P1\",\"The heart and double circulation\",\"Humans have a double circulation. The heart pumps blood to the lungs and to the rest of the body.\",\"heart double circulat pump\"],[\"P2\",\"Blood vessels\",\"Arteries carry blood away from the heart at high pressure; veins bring it back and have valves; capillaries are one cell thick for exchange.\",\"arter vein capillar valve\"],[\"P3\",\"Blood\",\"Red blood cells carry oxygen using haemoglobin; white blood cells fight infection; platelets help clotting; plasma carries everything else.\",\"haemoglobin white platelet plasma red blood\"],[\"P4\",\"Xylem and phloem\",\"Xylem carries water and minerals up from the roots. Phloem carries sugars both ways, called translocation.\",\"xylem phloem transloc\"],[\"P5\",\"Transpiration\",\"Water evaporates from leaves through stomata. The rate rises with light, temperature and air movement.\",\"transpir stomata evaporat\"]]},\n  \"Algebra\":{subj:\"Mathematics\", pts:[[\"P1\",\"Simplifying\",\"Collect like terms, e.g. 3x + 2x = 5x. You can only combine terms with the same letter and power.\",\"like term simplif collect\"],[\"P2\",\"Expanding and factorising\",\"Expanding multiplies out brackets. Factorising puts them back in, e.g. 2x + 6 = 2(x + 3).\",\"expand factoris bracket\"],[\"P3\",\"Solving linear equations\",\"Do the same thing to both sides to get x on its own, e.g. 3x + 5 = 20 gives x = 5.\",\"solve both sides equation\"],[\"P4\",\"Rearranging formulae\",\"Change the subject using inverse operations, undoing them in reverse order.\",\"rearrang subject inverse formula\"],[\"P5\",\"Sequences\",\"The nth term of a linear sequence is an + b, where a is the common difference.\",\"sequence nth term difference\"]]},\n  \"Geometry and trigonometry\":{subj:\"Mathematics\", pts:[[\"P1\",\"Angle facts\",\"Angles in a triangle add to 180°, on a straight line to 180° and around a point to 360°.\",\"angle 180 360 triangle\"],[\"P2\",\"Pythagoras’ theorem\",\"In a right-angled triangle, a² + b² = c², where c is the hypotenuse.\",\"pythagoras hypotenuse right\"],[\"P3\",\"SOH CAH TOA\",\"sin = opposite ÷ hypotenuse, cos = adjacent ÷ hypotenuse, tan = opposite ÷ adjacent.\",\"sin cos tan opposite adjacent soh\"],[\"P4\",\"Area and perimeter\",\"The area of a triangle is ½ × base × height. A circle’s area is πr² and its circumference is 2πr.\",\"area perimeter circumference pi\"]]},\n  \"Number\":{subj:\"Mathematics\", pts:[[\"P1\",\"Rounding\",\"Look at the next digit: 5 or more rounds up. Significant figures start at the first non-zero digit.\",\"round significant decimal place\"],[\"P2\",\"Fractions, decimals and percentages\",\"Convert by dividing: 3/4 = 0.75 = 75%.\",\"fraction decimal percent\"],[\"P3\",\"Order of operations\",\"Use BIDMAS: brackets, indices, division and multiplication, then addition and subtraction.\",\"bidmas order bracket indices\"],[\"P4\",\"Primes, factors and multiples\",\"A prime has exactly two factors. Prime factor trees help find the HCF and LCM.\",\"prime factor multiple hcf lcm\"]]},\n  \"Statistics\":{subj:\"Mathematics\", pts:[[\"P1\",\"Averages\",\"Mean = total ÷ number of values; the median is the middle value; the mode is the most common.\",\"mean median mode average\"],[\"P2\",\"Range\",\"Range = largest − smallest. It shows how spread out the data
